# C5-REAL Lefthook Pre-commit Configuration (Shift-Left)
pre-commit:
  parallel: true
  commands:
    secrets:
      glob: "*"
      run: detect-secrets-hook --baseline .secrets.baseline {staged_files}
      fallback: echo "ALERTA CRÍTICA: detect-secrets no instalado. Abortando commit para prevenir fuga entrópica." && exit 1

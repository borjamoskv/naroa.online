name: C5-REAL CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Build project
        run: pnpm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install portfolio image tools
        run: python -m pip install -r tools/requirements-immersive.txt

      - name: Build complete immersive portfolio
        run: pnpm run build:site

      - name: Validate portfolio routes and interactions
        run: pnpm run test:site

